<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tunnels - Tunnel Server</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="bi bi-cloud-arrow-up"></i>
                Tunnel Server
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">
                            <i class="bi bi-speedometer2"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/clients">
                            <i class="bi bi-laptop"></i> Clients
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/tunnels">
                            <i class="bi bi-diagram-3"></i> Tunnels
                        </a>
                    </li>
                </ul>
                <span class="navbar-text">
                    Domain: {{ domain }}
                </span>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-12">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h1><i class="bi bi-diagram-3"></i> Tunnels Management</h1>
                    <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#createTunnelModal">
                        <i class="bi bi-plus-circle"></i> New Tunnel
                    </button>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h5 class="card-title mb-0">Active Tunnels</h5>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover" id="tunnelsTable">
                                <thead>
                                    <tr>
                                        <th>Subdomain</th>
                                        <th>Public URL</th>
                                        <th>Client</th>
                                        <th>Local Target</th>
                                        <th>Protocol</th>
                                        <th>Status</th>
                                        <th>Created</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="tunnelsTableBody">
                                    <tr>
                                        <td colspan="8" class="text-center text-muted">
                                            <div class="spinner-border spinner-border-sm me-2" role="status"></div>
                                            Loading tunnels...
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Create Tunnel Modal -->
    <div class="modal fade" id="createTunnelModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Create New Tunnel</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="createTunnelForm">
                        <div class="mb-3">
                            <label for="tunnelClient" class="form-label">Client</label>
                            <select class="form-select" id="tunnelClient" required>
                                <option value="">Select a client...</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="tunnelSubdomain" class="form-label">Subdomain</label>
                            <input type="text" class="form-control" id="tunnelSubdomain" required
                                   placeholder="myapp" pattern="[a-zA-Z0-9-]+">
                            <div class="form-text">Only letters, numbers and hyphens allowed</div>
                        </div>
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="tunnelLocalHost" class="form-label">Local Host</label>
                                    <input type="text" class="form-control" id="tunnelLocalHost" 
                                           value="localhost" required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="tunnelLocalPort" class="form-label">Local Port</label>
                                    <input type="number" class="form-control" id="tunnelLocalPort" 
                                           required min="1" max="65535" placeholder="3000">
                                </div>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="tunnelProtocol" class="form-label">Protocol</label>
                            <select class="form-select" id="tunnelProtocol">
                                <option value="http">HTTP</option>
                                <option value="https">HTTPS</option>
                                <option value="tcp">TCP</option>
                                <option value="ws">WebSocket</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-success" onclick="createTunnel()">Create Tunnel</button>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-light mt-5 py-4">
        <div class="container text-center">
            <p class="text-muted mb-0">Tunnel Server &copy; 2024</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/app.js"></script>
    <script src="/static/js/tunnels.js"></script>
</body>
</html>
